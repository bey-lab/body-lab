<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BODY-LAB | 研究所</title>
<style>
:root{font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;background:#fff8e9;color:#293247}*{box-sizing:border-box}body{margin:0}
header{padding:22px clamp(18px,5vw,58px);display:flex;gap:10px;align-items:center;justify-content:space-between}.brand{font-size:clamp(24px,4vw,33px);font-weight:1000;letter-spacing:.03em}.tagline{color:#7e6b48;font-size:15px;margin:4px 0}.sp{background:#fff;border-radius:18px;padding:13px 20px;font-weight:900;box-shadow:0 5px 19px #5e410c12}
main{max-width:1250px;margin:auto;padding:12px clamp(15px,3vw,40px) 42px}.main{display:grid;grid-template-columns:minmax(270px,46%) minmax(0,1fr);gap:20px;min-height:560px}
.hero{border-radius:27px;background:linear-gradient(145deg,#ffd96b,#fff4cd 70%);display:flex;flex-direction:column;justify-content:space-between;padding:26px;overflow:hidden}
.hero-art{flex:1;min-height:280px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;overflow:hidden}.hero-illustration:not([hidden]){display:block}.hero-illustration{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center bottom;filter:drop-shadow(0 10px 14px #9b702644)}.hero-art:has(.hero-illustration:not([hidden])) .sun,.hero-art:has(.hero-illustration:not([hidden])) .placeholder{display:none}.sun{font-size:clamp(85px,15vw,170px);line-height:1.2}.name{font-size:23px;font-weight:900}.placeholder{color:#997d43;font-size:13px}.speech{background:#fff;border:2px solid #efc75d;border-radius:18px;padding:22px;font-size:clamp(18px,2vw,22px);font-weight:850;line-height:1.65}
.actions{background:white;border-radius:27px;padding:clamp(20px,3vw,32px);box-shadow:0 8px 26px #6045230b;display:flex;flex-direction:column;gap:16px}
h1{margin:0;font-size:clamp(24px,3vw,32px)}.muted{color:#657181;line-height:1.6}a{text-decoration:none}.button{display:block;padding:21px 22px;border-radius:18px;background:#ffc747;color:#332612;font-size:clamp(19px,2.2vw,23px);font-weight:900;text-align:center}.button.sub{background:#eff2f7;color:#343c52;font-size:19px}.small-actions{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stats{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stat{background:#f5f7fb;padding:20px;border-radius:16px}.stat strong{display:block;font-size:26px}.stat small{color:#6b7480}.last{font-size:16px;background:#fff9e8;border-radius:12px;padding:15px;line-height:1.7}.links{display:flex;gap:20px;flex-wrap:wrap;margin-top:22px;font-size:14px;color:#586575}
@media(max-width:780px){.main{grid-template-columns:1fr}.hero{min-height:0;flex-direction:row;gap:12px;align-items:center;padding:16px}.hero-art{flex:0 0 100px;min-height:0}.sun{font-size:60px}.name{font-size:15px}.placeholder{display:none}.speech{flex:1;padding:14px;font-size:18px}.actions{padding:19px}}@media(max-width:420px){.small-actions{grid-template-columns:1fr}.hero-art{flex-basis:75px}}
</style></head><body>
<header><div><div class="brand">☀️ BODY-LAB</div><p class="tagline">不純な動機で、健全な肉体を。</p></div><div class="sp">研究SP <span id="sp">--</span></div></header>
<main><div class="main">
<section class="hero"><div class="hero-art"><img class="hero-illustration" src="./assets/characters/hinata.webp" alt="明日葉ヒナタの立ち絵" hidden onload="this.hidden=false" onerror="this.hidden=true"><div class="sun">☀️</div><div class="name">明日葉ひなた</div><span class="placeholder">立ち絵スペース・準備中</span></div><div class="speech" id="greeting">「所長っ！今日も一緒に頑張りましょう！」</div></section>
<section class="actions"><h1>研究所へようこそ！</h1><div class="muted">ちょっと動く日も、身体をいたわる日も。少しずつ研究を積み重ねよう。</div>
<div class="stats"><div class="stat"><small id="todayLabel">今日の記録</small><strong id="today">--</strong></div><div class="stat"><small>活動日数</small><strong id="days">--</strong></div></div>
<a class="button" href="./training.html">💪 今日のトレーニング</a>
<div class="small-actions"><a class="button sub" href="./tree.html">🌳 研究ツリー</a><a class="button sub" href="./backup-test.html">🔐 バックアップ</a></div>
<div class="last"><b>最新の研究記録</b><div id="latest">記録を読み込み中…</div></div>
<div class="muted" style="font-size:14px">SPは回数に比例しません。継続・振り返り・運動のバランスを大切に。</div>
</section></div>
<nav class="links"><a href="./storage-test.html">保存テスト</a><a href="./tree-test.html">旧研究ツリー試験</a><a href="./backup-test.html">JSONエクスポート・復元</a></nav></main>
<script type="module">
import {readTrainingSummary,findExercise,localDay} from "./js/training.js";
import {watchResearchDay} from "./js/day-watch.js";
const $=id=>document.getElementById(id);
let shownDay=localDay();
async function renderHome(newDay=false){
 try{
 const summary=await readTrainingSummary();
 shownDay=summary.today;
 $("sp").textContent=summary.sp;
 $("today").textContent=summary.todayRecords.length+" 件";
 $("todayLabel").textContent="今日の記録";
 $("days").textContent=summary.activeDays+" 日";
 if(summary.records.length){
 const last=summary.records[0],ex=findExercise(last.exerciseId);
 $("latest").textContent=(ex?.name||last.exerciseId)+"："+(last.reps??last.duration)+(ex?.unit||"")+" × "+last.sets+"セット";
 }else $("latest").textContent="まだ研究記録がありません。最初の一歩から！";
 $("greeting").textContent=newDay?
 "「所長っ！新しい研究日ですっ！昨日の記録はちゃんと残っていますよ。今日も無理せずいきましょう！」":
 summary.todayRecords.length?
 "「所長っ！今日も研究お疲れさまです！続けているところ、かっこいいですっ！」":
 "「所長っ！今日はどんな一日にしましょう？休息も大切な研究ですよっ！」";
 }catch(error){$("latest").textContent="記録を読み込めませんでした："+error.message}
}
await renderHome();
watchResearchDay(()=>renderHome(true));
document.addEventListener("visibilitychange",()=>{if(!document.hidden)renderHome(localDay()!==shownDay)});
window.addEventListener("pageshow",()=>renderHome(localDay()!==shownDay));
</script></body></html>
