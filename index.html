
<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>BODY-LAB</title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background: #fff8e8;
      color: #343434;
      text-align: center;
    }
    header {
      background: #ffca45;
      padding: 32px 16px;
    }
    h1 { margin: 0; font-size: 36px; }
    main { padding: 40px 20px; }
    .card {
      max-width: 480px;
      margin: auto;
      padding: 28px;
      background: white;
      border-radius: 24px;
      box-shadow: 0 8px 24px #00000012;
    }
    button {
      padding: 16px 30px;
      border: none;
      border-radius: 14px;
      background: #ffbb35;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <header>
    <h1>BODY-LAB</h1>
    <p>不純な動機で、健全な肉体を。</p>
  </header>
  <main>
    <div class="card">
      <h2>☀️ 明日葉ひなた</h2>
      <p>「所長っ！今日も一緒に頑張りましょう！」</p>
      <button onclick="alert('所長っ！今日もかっこいいです！')">
        トレーニング開始！
      </button>
    </div>
  </main>
</body>
</html>
