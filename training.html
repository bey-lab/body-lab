<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>トレーニング | BODY-LAB</title>
<style>
:root{font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN",sans-serif;color:#293247;background:#fff8eb}*{box-sizing:border-box}
body{margin:0}button,input,textarea{font:inherit}button{cursor:pointer;font-weight:800;border:0;border-radius:15px;padding:14px 18px;min-height:50px}
button:disabled{cursor:default;opacity:.5}a{color:inherit}header{display:flex;align-items:center;justify-content:space-between;padding:13px clamp(16px,4vw,44px);background:#fff;box-shadow:0 2px 12px #4b3c2c10;gap:10px}
.logo{font-weight:950;font-size:1.2rem}.pill{background:#fff3d5;border-radius:99px;padding:9px 15px;font-weight:850}.layout{display:grid;grid-template-columns:minmax(250px,36%) minmax(0,1fr);gap:20px;max-width:1320px;margin:auto;padding:20px}
.character{border-radius:24px;background:linear-gradient(160deg,#ffe17b,#fff2c5 60%,#fdf5e5);padding:16px;min-height:570px;display:flex;flex-direction:column;justify-content:space-between}
.character-stage{flex:1;position:relative;display:flex;align-items:center;justify-content:center;min-height:290px;text-align:center;overflow:hidden}.character-image{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;object-position:center bottom;filter:drop-shadow(0 8px 14px #a27d4e44)}.character-stage:has(.character-image:not([hidden])) .character-standin,.character-stage:has(.character-image:not([hidden])) .character-name,.character-stage:has(.character-image:not([hidden])) small{display:none}
.character-standin{font-size:clamp(5rem,13vw,9rem);line-height:1.2}.character-name{font-weight:900;font-size:1.2rem}.dialogue{background:#fff;border:2px solid #f0cb6b;border-radius:18px;padding:20px;font-weight:800;font-size:clamp(18px,2vw,23px);line-height:1.7}
.panel{background:#fff;border-radius:24px;padding:clamp(18px,3vw,32px);box-shadow:0 8px 26px #493b280d;min-width:0}.steps{display:flex;gap:8px;margin-bottom:25px}.step{flex:1;text-align:center;background:#e9edf4;padding:12px 3px;border-radius:12px;font-size:clamp(13px,1.4vw,17px);font-weight:800}.step.active{background:#ffcf55}
h1{font-size:clamp(23px,3vw,31px);margin:0 0 8px}h2{font-size:clamp(20px,2vw,25px);margin:18px 0 10px}p{line-height:1.7}.muted{color:#677184}.section{margin-top:15px}.cards{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px}.exercise{background:#f4f6fa;border:2px solid transparent;text-align:left;padding:18px;min-height:95px;font-size:17px}.exercise span{display:block;color:#667182;font-size:14px;margin-top:5px;font-weight:500}.exercise.selected{background:#fff4d5;border-color:#edb132}.primary{background:#ffc849;color:#34240a}.secondary{background:#e9edf4;color:#293247}.full{width:100%;margin-top:15px}.guide-visual{height:165px;border-radius:16px;background:repeating-linear-gradient(130deg,#f5f7fb,#f5f7fb 16px,#edf1f8 16px,#edf1f8 18px);display:flex;flex-direction:column;justify-content:center;align-items:center;gap:8px;color:#5f6d7f;margin:15px 0}.guide-visual b{font-size:1.1rem}.guide-list{font-size:clamp(18px,1.7vw,21px);line-height:1.65;padding-left:30px}.guide-list li{margin:12px 0}.warning{border-left:5px solid #e8aa36;background:#fff7df;padding:14px;border-radius:8px;font-size:16px;line-height:1.7}.buttons{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}.buttons button{flex:1}.inputs{display:grid;grid-template-columns:1fr 1fr;gap:15px}.field{display:flex;flex-direction:column;gap:7px;font-weight:800}.field input,.field textarea{width:100%;font-size:22px;padding:12px;border:2px solid #dce2e9;border-radius:12px;min-width:0}.field textarea{font-size:16px;min-height:85px}.field small{font-weight:500;color:#687488}.efforts{display:flex;gap:9px;flex-wrap:wrap}.effort{background:#e9edf4}.effort.selected{background:#ffce55}.success{background:#f3fff7;border:2px solid #91d2ad;border-radius:18px;padding:22px;font-size:18px}.success strong{font-size:30px;color:#11884d}.status{color:#a52e2e;font-weight:700;min-height:25px}.hidden{display:none!important}
@media(max-width:800px){.layout{grid-template-columns:1fr;padding:12px;gap:12px}.character{min-height:0;flex-direction:row;align-items:center;gap:14px}.character-stage{min-height:0;flex:0 0 95px}.character-standin{font-size:4rem}.dialogue{flex:1;padding:12px;font-size:17px}.character-name{display:none}.panel{padding:18px}.guide-visual{height:120px}}@media(max-width:450px){.cards{grid-template-columns:1fr}.inputs{grid-template-columns:1fr}.layout{padding:8px}.steps{margin-bottom:15px}.character-stage{flex-basis:65px}.character-standin{font-size:3rem}}
</style></head>
<body>
<header><a href="./" class="logo">☀️ BODY-LAB</a><span class="pill"><span id="researchDay"></span>　研究SP <span id="sp">--</span></span></header>
<main class="layout">
<aside class="character"><div class="character-stage"><img class="character-image" src="./assets/characters/hinata.webp" alt="明日葉ヒナタの立ち絵" hidden onload="this.hidden=false" onerror="this.hidden=true"><div><div class="character-standin">☀️</div><div class="character-name">明日葉ひなた</div><small class="muted">立ち絵準備中</small></div></div>
<div id="dialogue" class="dialogue">「所長っ！今日はどこを鍛えましょうか？」</div></aside>
<section class="panel">
<div class="steps"><div class="step active" id="nav-select">① 種目を選ぶ</div><div class="step" id="nav-guide">② ガイド</div><div class="step" id="nav-record">③ 結果入力</div></div>
<div id="select"><h1>今日のトレーニング</h1><p class="muted">種目を選ぼう。無理せず、今日できることを！</p><div id="cards" class="cards"></div><button id="toGuide" class="primary full">フォームを確認する →</button></div>
<div id="guide" class="hidden"><h1 id="guideTitle"></h1><p id="guideTip" class="muted"></p><div class="guide-visual"><b>フォーム図解は準備中</b><small>ここに種目別の大きな図解を配置予定</small></div><h2>やり方</h2><ol class="guide-list" id="guideSteps"></ol><div class="warning" id="guideCaution"></div><div class="buttons"><button class="secondary" id="backSelect">← 種目変更</button><button class="primary" id="toRecord">運動が終わった！ →</button></div></div>
<div id="record" class="hidden"><h1 id="recordTitle"></h1><p id="previous" class="muted"></p><div class="inputs">
<label class="field" id="amountField">回数<input id="amount" type="number" inputmode="numeric" min="1" step="1" value="10"></label>
<label class="field">セット数<input id="sets" type="number" inputmode="numeric" min="1" max="30" step="1" value="1"></label>
<label class="field hidden" id="weightField">ダンベルの重さ（1本あたりkg）<input id="kg" type="number" inputmode="decimal" min="0.5" max="100" step="0.5" value="5"></label>
</div>
<h2>きつさはどうだった？</h2><div class="efforts"><button class="effort" data-effort="1">😊 らく</button><button class="effort selected" data-effort="2">🙂 ふつう</button><button class="effort" data-effort="3">💦 きつい</button></div>
<div class="section"><label class="field">メモ（任意）<textarea id="note" maxlength="300" placeholder="今日はフォームが安定した！"></textarea></label></div>
<div class="buttons"><button class="secondary" id="backGuide">← ガイドへ</button><button class="primary" id="save">研究記録を保存！</button></div><p id="status" class="status" aria-live="polite"></p></div>
<div id="done" class="hidden"><h1>🎉 研究記録を保存したぞ！</h1><div class="success"><p id="resultDetail"></p><p>獲得した研究SP</p><strong id="earned"></strong><p id="rewardNote" class="muted"></p></div><div class="buttons"><button class="secondary" id="again">もう1種目</button><button class="primary" id="home">ホームへ戻る →</button></div></div>
</section></main>
<script type="module">
import {EXERCISES,readTrainingSummary,saveTraining,localDay} from "./js/training.js";
import {watchResearchDay} from "./js/day-watch.js";
const $=id=>document.getElementById(id);
let chosen=EXERCISES[0],effort=2,busy=false,summary=null,shownDay=localDay();
function dateLabel(day){const parts=day.split("-");return Number(parts[1])+"月"+Number(parts[2])+"日";}
function say(s){$("dialogue").textContent=s}
function phase(p){for(const name of ["select","guide","record","done"])$(name).classList.toggle("hidden",name!==p);for(const name of ["select","guide","record"])$("nav-"+name).classList.toggle("active",p===name);window.scrollTo({top:0,behavior:"instant"})}
function renderCards(){const root=$("cards");root.replaceChildren();for(const ex of EXERCISES){const btn=document.createElement("button");btn.className="exercise"+(ex.id===chosen.id?" selected":"");btn.textContent=ex.name;const small=document.createElement("span");small.textContent=ex.category+" / "+ex.tip;btn.append(small);btn.onclick=()=>{chosen=ex;renderCards();say("「"+ex.name+"ですね！一緒に頑張りましょうっ！」")};root.append(btn)}}
function guide(){phase("guide");$("guideTitle").textContent=chosen.name;$("guideTip").textContent=chosen.tip;const steps=$("guideSteps");steps.replaceChildren();for(const line of chosen.steps){const li=document.createElement("li");li.textContent=line;steps.append(li)}$("guideCaution").textContent="⚠️ "+chosen.caution;say("「所長っ！まずはフォームを確認しましょう！」")}
function record(){phase("record");$("recordTitle").textContent=chosen.name+"の結果";const prev=summary?.records.find(r=>r.exerciseId===chosen.id);$("amountField").firstChild.textContent=chosen.kind==="reps"?"回数":chosen.kind==="seconds"?"保持時間（秒）":"運動時間（分）";$("weightField").classList.toggle("hidden",!chosen.weight);
$("amount").value=prev?(prev.reps??prev.duration):(chosen.kind==="minutes"?10:chosen.kind==="seconds"?30:10);$("sets").value=prev?.sets||1;$("kg").value=prev?.weightKg||5;
$("previous").textContent=prev?"前回："+(prev.reps??prev.duration)+chosen.unit+" × "+prev.sets+"セット":"初めての記録だ！";$("status").textContent="";say("「お疲れさまですっ！結果を教えてくださいね！」")}
async function refresh(){summary=await readTrainingSummary();shownDay=summary.today;$("sp").textContent=summary.sp;$("researchDay").textContent=dateLabel(shownDay)}
$("toGuide").onclick=guide;$("backSelect").onclick=()=>{phase("select");say("「次はどの種目にしましょうか？」")};$("toRecord").onclick=record;$("backGuide").onclick=guide;$("again").onclick=async()=>{await refresh();phase("select");say("「まだ研究するんですか？無理は禁物ですよっ！」")};$("home").onclick=()=>location.assign("./");
for(const btn of document.querySelectorAll("[data-effort]"))btn.onclick=()=>{effort=Number(btn.dataset.effort);for(const b of document.querySelectorAll("[data-effort]"))b.classList.toggle("selected",b===btn)};
$("save").onclick=async()=>{if(busy)return;busy=true;$("save").disabled=true;$("status").textContent="";
try{const result=await saveTraining({exerciseId:chosen.id,amount:$("amount").value,sets:$("sets").value,kg:$("kg").value,effort,note:$("note").value});await refresh();$("resultDetail").textContent=chosen.name+"："+result.amount+chosen.unit+" × "+result.sets+"セット";$("earned").textContent="+"+result.earned+" SP";$("rewardNote").textContent=result.earned===0?"今日のSPは獲得済み。記録したこと自体が研究成果だ！":"今日の研究にSPが加算された！";say("「所長っ！今日もかっこいいですっ！お疲れさまでした！」");phase("done")}
catch(e){$("status").textContent="保存できませんでした："+e.message}
finally{busy=false;$("save").disabled=false}};
try{await refresh();renderCards()}catch(e){$("status").textContent="初期化に失敗しました："+e.message;renderCards()}
async function onDayChange(){await refresh();if(!$("done").classList.contains("hidden"))return;say("「所長っ！新しい研究日になりましたっ！今日も無理なくいきましょう！」");if(!$("record").classList.contains("hidden"))$("previous").textContent="日付が切り替わりました。記録は保存時点の日付になります。";}
watchResearchDay(onDayChange);
document.addEventListener("visibilitychange",()=>{if(!document.hidden)onDayChangeIfNeeded()});
window.addEventListener("pageshow",onDayChangeIfNeeded);
function onDayChangeIfNeeded(){if(localDay()!==shownDay)onDayChange();else refresh()}
</script></body></html>
