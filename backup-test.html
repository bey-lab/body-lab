<!doctype html>
<html lang="ja">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BODY-LAB バックアップ試験</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;background:#fff8e8;color:#34343d}
body{margin:0 auto;max-width:720px;padding:22px 16px 60px}
h1{font-size:1.55rem}h2{font-size:1.2rem}
.card{background:white;border-radius:20px;padding:20px;margin:16px 0;box-shadow:0 8px 25px #0001}
button{background:#ffc843;border:0;border-radius:12px;padding:13px 18px;font-size:1rem;font-weight:700;cursor:pointer;margin:5px 4px 5px 0}
button:disabled{opacity:.4}
button.secondary{background:#e8edf5}
button.danger{background:#ffe0db;color:#8c2420}
input[type=file]{width:100%;max-width:100%;margin:10px 0}
pre{white-space:pre-wrap;word-break:break-word;background:#f3f4f7;padding:12px;border-radius:10px}
small{color:#676777}.ok{color:#16743b}.bad{color:#b12c2c}
label{display:block;margin:12px 0}
</style></head>
<body>
<h1>🔐 BODY-LAB バックアップ試験</h1>
<small>開発用 v0.1 / 実際のセーブデータを扱います</small>
<div class="card">
<h2>① 現在のデータを確認</h2>
<button id="inspect">保存データを読み取る</button>
<pre id="current">確認前</pre>
</div>
<div class="card">
<h2>② JSONバックアップ</h2>
<p>端末内の全データを1つのJSONファイルとして保存します。GitHubに運動記録は送信しません。</p>
<button id="export">バックアップを書き出す</button>
<p id="exportStatus" aria-live="polite"></p>
</div>
<div class="card">
<h2>③ JSON復元テスト</h2>
<p><strong>注意：</strong>復元すると現在の全データがバックアップの内容に置き換わります。まず保存済みのJSONを用意してください。</p>
<label for="file">復元するJSONを選択</label>
<input id="file" type="file" accept=".json,application/json">
<button id="verify" class="secondary">ファイルを検証する</button>
<pre id="preview">未選択</pre>
<label><input id="understand" type="checkbox"> 現在の全データが置き換わることを理解しました</label>
<button id="restore" class="danger" disabled>検証済みデータを復元する</button>
<p id="restoreStatus" aria-live="polite"></p>
</div>
<p><a href="./storage-test.html">← 保存テストへ</a>　<a href="./">ホームへ</a></p>
<script type="module">
import {createBackup,backupText,backupCounts,parseAndValidateBackup,restoreBackup} from "./js/backup.js";
const $ = id => document.getElementById(id);
let verified = null;
let verifiedText = "";
const message = (target,text,error=false) => {
  $(target).textContent=text;$(target).className=error?"bad":"ok";
};
async function refresh(){
 try {
 const b=await createBackup();
 $("current").textContent=JSON.stringify({exportedAt:b.exportedAt,counts:backupCounts(b),checksum:b.checksum},null,2);
 }catch(e){$("current").textContent="読み取り失敗: "+e.message}
}
async function saveFile(){
 const b=await createBackup();
 const blob=new Blob([backupText(b)],{type:"application/json;charset=utf-8"});
 const url=URL.createObjectURL(blob);
 const a=document.createElement("a");
 a.href=url;a.download="BODY-LAB-backup-"+new Date().toISOString().replace(/[:.]/g,"-")+".json";
 document.body.appendChild(a);a.click();a.remove();
 setTimeout(()=>URL.revokeObjectURL(url),10000);
 message("exportStatus","JSONの保存操作を開始しました。ファイルアプリに保存されたか確認してください。");
}
$("inspect").onclick=refresh;
$("export").onclick=async()=>{try{await saveFile()}catch(e){message("exportStatus","失敗: "+e.message,true)}};
$("file").onchange=()=>{verified=null;verifiedText="";$("restore").disabled=true;$("preview").textContent="未検証";};
$("understand").onchange=()=>{$("restore").disabled=!(verified&&$("understand").checked)};
$("verify").onclick=async()=>{
 verified=null;verifiedText="";$("restore").disabled=true;
 try {
  const file=$("file").files[0];
  if(!file)throw new Error("JSONファイルを選んでください");
  if(file.size>20*1024*1024)throw new Error("20MB以下のJSONのみ対応");
  const text=await file.text();
  const b=await parseAndValidateBackup(text);
  verified=b;verifiedText=text;
  $("preview").textContent=JSON.stringify({exportedAt:b.exportedAt,counts:backupCounts(b),checksum:b.checksum,validation:"OK"},null,2);
  $("restore").disabled=!$("understand").checked;
 }catch(e){$("preview").textContent="検証失敗: "+e.message}
};
$("restore").onclick=async()=>{
 if(!verified||!$("understand").checked)return;
 if(!confirm("現在の全保存データを置き換えます。復元前のJSONバックアップは保存済みですか？"))return;
 $("restore").disabled=true;
 try {
  // Revalidate selected content before changing data.
  const archive=await parseAndValidateBackup(verifiedText);
  await restoreBackup(archive);
  message("restoreStatus","✅ 復元処理が完了しました。保存データを再読み込みして確認してください。");
  await refresh();
 }catch(e){message("restoreStatus","復元失敗（変更はロールバックされます）: "+e.message,true)}
 finally {$("restore").disabled=!(verified&&$("understand").checked)}
};
refresh();
</script>
</body></html>
