<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>BODY-LAB 保存テスト</title>
<style>
:root{font-family:system-ui,-apple-system,sans-serif;color:#303039;background:#fff9ea}
body{margin:0;padding:0 16px 24px}
h1{font-size:1.6rem;margin-bottom:4px}
small{color:#65636b}
section{background:white;padding:20px;border-radius:18px;box-shadow:0 4px 18px #0001;margin:20px 0}
button{background:#ffca45;color:#302817;font-weight:700;border:0;border-radius:12px;padding:14px 18px;font-size:1rem;margin:5px 4px 5px 0;cursor:pointer}
button.secondary{background:#e9edf5}
pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#f5f6fa;padding:12px;border-radius:9px;font-size:.85rem}
.ok{color:#147747}.bad{color:#b22929}
</style>
</head>
<body>
<h1>🏗️ BODY-LAB 保存テスト</h1>
<small>開発用 / v0.1 — この端末のブラウザ内のみ保存</small>
<section>
<h2>研究所の金庫を検査する</h2>
<p>テスト用の「腕立て10回」と「+5 SP」を同時保存します。実際の運動記録ではありません。</p>
<button id="save">① テスト記録を保存</button>
<button id="read" class="secondary">② 保存内容を確認</button>
<button id="reload" class="secondary">③ 再読み込み</button>
<p id="status" aria-live="polite">準備中…</p>
<pre id="output">未確認</pre>
</section>
<section>
<h2>テスト手順</h2>
<p>①保存 → ②確認 → ③再読み込み → ②再確認。再読み込み後も10回と5SPが見えれば、永続保存の基本テスト成功です。</p>
<p>※テストは固定IDを使用。二度保存してもSPを重複発行しません。実データを削除する機能はありません。</p>
<a href="./">← ホームへ戻る</a>
</section>
<script type="module">
import {openBodyLabDB,atomicWrite,getOne,STORES} from "./js/db.js";
const TEST_ID = "dev-test-pushup-001";
const LEDGER_ID = "dev-test-sp-001";
const $ = id => document.getElementById(id);
const showStatus = (message, error=false) => {
  $("status").className = error ? "bad" : "ok";
  $("status").textContent = message;
};
async function read() {
  try {
    const record = await getOne(STORES.records, TEST_ID);
    const ledger = await getOne(STORES.spLedger, LEDGER_ID);
    if (!record || !ledger) {
      $("output").textContent = JSON.stringify({record,ledger},null,2);
      showStatus("まだテスト記録がありません（または片方がありません）",!!(record||ledger));
      return;
    }
    const valid = record.reps === 10 && ledger.delta === 5 && ledger.sourceKey === TEST_ID;
    $("output").textContent = JSON.stringify({
      種目: record.exerciseId, 回数: record.reps,
      SP増減: ledger.delta, 保存日時: record.performedAt,
      レコードID: record.id
    },null,2);
    showStatus(valid ? "✅ 記録とSPを読み出せました" : "⚠️ 保存内容が想定と違います",!valid);
  } catch(error){showStatus("読み込み失敗: "+error.message,true)}
}
$("save").onclick = async () => {
  $("save").disabled = true;
  try {
    const saved = await getOne(STORES.records, TEST_ID);
    if(saved){showStatus("テストデータは保存済み。重複付与しません");await read();return}
    const performedAt = new Date().toISOString();
    await atomicWrite([STORES.records,STORES.spLedger],tx => {
      tx.objectStore(STORES.records).add({
        id:TEST_ID,profileId:"dev-test",exerciseId:"push-up",reps:10,
        performedAt,sourceMode:"development-test",schemaVersion:1
      });
      tx.objectStore(STORES.spLedger).add({
        id:LEDGER_ID,profileId:"dev-test",sourceKey:TEST_ID,
        delta:5,reason:"development-test",createdAt:performedAt
      });
    });
    await read();
  } catch(error){showStatus("保存失敗: "+error.message,true)}
  finally {$("save").disabled=false}
};
$("read").onclick = read;
$("reload").onclick = () => location.reload();
try {await openBodyLabDB();showStatus("データベース接続OK。保存テストできます");await read()}
catch(error){showStatus("初期化失敗: "+error.message,true)}
</script>
<script type="module" src="./js/navigation.js"></script>
</body></html>
